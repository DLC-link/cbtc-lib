name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch public Canton dependencies over HTTPS
        run: git config --global url."https://github.com/DLC-link/".insteadOf "ssh://git@github.com/DLC-link/"
      - uses: Swatinem/rust-cache@v2
      - env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test --workspace --locked --lib --bins --test shared
