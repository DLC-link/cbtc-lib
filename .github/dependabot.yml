version: 2

# One pull request per week for the whole repo: every ecosystem joins this group.
# Major versions are never proposed here. Security fixes do not wait for this
# schedule. An ignore rule with update-types, like the one for majors, does not
# block security fixes. An ignore rule that only names a package blocks that
# package's security fixes too, but its Dependabot alerts still show.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    ignore:
      # Internal DLC-link crates: owners upgrade these on purpose, so Dependabot does not track them.
      - dependency-name: common
      - dependency-name: keycloak
      - dependency-name: ledger
      - dependency-name: registry
      - dependency-name: token
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
